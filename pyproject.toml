[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-stream"
version = "0.1.0"
description = "Health Intelligence Platform — Proactive Knowledge Stream"
requires-python = ">=3.11"
dependencies = [
    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # Data / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    # HTTP client
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    # Object storage
    "minio>=7.2.7",
    # Vector store
    "qdrant-client>=1.9.0",
    # Cache / queue
    "redis>=5.0.0",
    # Workflow orchestration
    "temporalio>=1.6.0",
    # LLM gateway
    "litellm>=1.40.0",
    # Text extraction
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pdfminer.six>=20231228",
    "pytesseract>=0.3.10",
    "Pillow>=10.3.0",
    # Observability
    "structlog>=24.2.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "python-slugify>=8.0.4",
    "xxhash>=3.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
